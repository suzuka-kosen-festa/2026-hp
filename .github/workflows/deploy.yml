name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
      # プレビューURLをコミットステータスとして出すため
      statuses: write
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          # 変更されたページを判定するため、ベースブランチとの差分が取れる深さが要る
          fetch-depth: 0

      # Nodeのバージョンは .node-version を唯一の情報源にする（CIと手元がズレないように）
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      # アニメーション低減設定まわりの不変条件チェック（ブラウザ不要・数百ms）
      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      # ページ単位で分担しているので、触ったページのE2Eだけを走らせる。
      # 共通部品を触った場合は affected-pages.mjs が全ページを返す。
      # ジョブ自体は常に実行する（paths フィルタで丸ごと止めると、
      # 必須チェックにしたときにPRが「待ち」のまま進まなくなるため）
      - name: 検査対象のページを判定
        id: affected
        env:
          BASE: ${{ github.base_ref }}
        run: echo "specs=$(node scripts/affected-pages.mjs "origin/${BASE:-main}")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        if: steps.affected.outputs.specs != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}

      - name: Install Playwright browser
        if: steps.affected.outputs.specs != ''
        run: npx playwright install --with-deps chromium

      - name: E2E
        if: steps.affected.outputs.specs != ''
        run: npx playwright test ${{ steps.affected.outputs.specs }}

      - name: Upload Playwright report
        if: failure() && steps.affected.outputs.specs != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: site/playwright-report/
          retention-days: 7

      - name: Ensure Cloudflare Pages project exists
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: pages project create snct-fes-2026 --production-branch=main

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: pages deploy dist --project-name=snct-fes-2026

      # コメントは --edit-last で1本を使い回す（コミットごとに増やすとレビューが埋もれる）。
      # 編集では通知が飛ばず、投稿時刻も最初のままなので「更新されていない」ように見える。
      # どのコミットのプレビューかを本文に書いて、古いURLと見間違えないようにする
      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body=$(printf '🔗 Preview: %s\n\ncommit `%s` / 更新 %s JST\n' \
            "${PREVIEW_URL}" "${HEAD_SHA:0:7}" "$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')")
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --edit-last --create-if-none \
            --body "${body}"

      # 上のコメントは埋もれるうえ通知も飛ばないので、PR下部のチェック欄にも出す。
      # ステータスはコミットに紐づくため、常に最新コミットのプレビューを指す
      - name: プレビューURLをコミットステータスに出す
        if: github.event_name == 'pull_request' && steps.deploy.outputs.deployment-url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${HEAD_SHA}" \
            -f state=success \
            -f context="Cloudflare Pages Preview" \
            -f target_url="${PREVIEW_URL}" \
            -f description="このコミットのプレビュー"
